<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AquaAssist</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef6f5;--card:#fff;--tx:#10262b;--mu:#4a6469;--ac:#0b4f5c;--on:#fff;--hi:#f2b400;--ln:#c9dcdc;--ok:#1f7a3a;--wa:#b36b00;--bd:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1e21;--card:#15292d;--tx:#eaf4f3;--mu:#9db8bb;--ac:#5cc5d4;--on:#062a30;--ln:#28444a;--ok:#5fd07f;--wa:#ffbf47;--bd:#ff8a80}}
:root[data-theme="dark"]{--bg:#0d1e21;--card:#15292d;--tx:#eaf4f3;--mu:#9db8bb;--ac:#5cc5d4;--on:#062a30;--ln:#28444a;--ok:#5fd07f;--wa:#ffbf47;--bd:#ff8a80}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:110px;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.6 "Noto Sans Telugu",system-ui,-apple-system,"Segoe UI",Roboto,"Nirmala UI",sans-serif}
header{background:var(--ac);color:var(--on);padding:18px 16px 26px}
.w{max-width:760px;margin:0 auto}
h1{margin:0;font-size:2rem;line-height:1.2}
header p{margin:4px 0 0;font-size:1.05rem}
.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:2px solid var(--ln);display:flex;gap:6px;align-items:center;padding:8px 10px;overflow-x:auto}
.bar a{flex:none;color:var(--tx);text-decoration:none;font-weight:700;padding:8px 12px;border-radius:8px;font-size:1rem}
.bar a:hover,.bar a:focus-visible{background:var(--bg);outline:2px solid var(--ac)}
#lang{flex:none;margin-left:auto;background:var(--hi);color:#1a1300;border:0;font:inherit;font-weight:700;padding:8px 14px;border-radius:8px;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:8px 14px 60px}
section{margin-top:30px}
h2{font-size:1.5rem;margin:0 0 12px;color:var(--ac);border-left:6px solid var(--hi);padding-left:10px}
.c{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.c h3{margin:0 0 6px;font-size:1.15rem}
.c p{margin:0}
details{background:var(--card);border:1px solid var(--ln);border-radius:12px;margin-bottom:10px}
summary{padding:14px 16px;font-weight:700;font-size:1.1rem;cursor:pointer}
details ul{margin:0;padding:0 16px 14px 36px}
li{margin-bottom:6px}
label{display:block;font-weight:700;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:12px;border:2px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx)}
input:focus,select:focus,textarea:focus,button:focus-visible,summary:focus-visible{outline:3px solid var(--hi);outline-offset:1px}
.g{display:grid;gap:0 12px;grid-template-columns:1fr}
@media(min-width:560px){.g{grid-template-columns:1fr 1fr 1fr}}
.btn{margin-top:14px;background:var(--ac);color:var(--on);border:0;font:inherit;font-weight:700;padding:13px 22px;border-radius:10px;cursor:pointer;width:100%}
@media(min-width:560px){.btn{width:auto}}
.r{margin-top:12px}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln)}
.ok{color:var(--ok)}.wa{color:var(--wa)}.bd{color:var(--bd)}
.st{font-weight:700}
.big{font-size:1.6rem;font-weight:700;color:var(--ac)}
.bars{margin:0}
.bl{display:flex;justify-content:space-between;font-weight:700;margin-top:10px}
.tr{background:var(--ln);border-radius:6px;height:22px;overflow:hidden}
.fl{height:100%;background:var(--ac);border-radius:6px}
.dl{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--ln)}
.dl small{color:var(--mu);display:block}
.x{flex:none;background:none;border:2px solid var(--bd);color:var(--bd);border-radius:8px;font:inherit;padding:4px 10px;cursor:pointer}
.mu{color:var(--mu);font-size:.95rem}
</style>
</head>
<body>
<header><div class="w"><h1>🐟 AquaAssist</h1><p data-t="sub"></p></div></header>
<nav class="bar" aria-label="Sections">
<a href="#learn" data-t="nLearn"></a><a href="#water" data-t="nWater"></a><a href="#feed" data-t="nFeed"></a><a href="#schemes" data-t="nSch"></a><a href="#diary" data-t="nDiary"></a><a href="#survey" data-t="nSur"></a>
<button id="lang" type="button" aria-label="Language">తెలుగు</button>
</nav>
<main>

<section id="learn"><h2 data-t="nLearn"></h2>
<details open><summary data-t="l1"></summary><ul data-l="l1i"></ul></details>
<details><summary data-t="l2"></summary><ul data-l="l2i"></ul></details>
<details><summary data-t="l3"></summary><ul data-l="l3i"></ul></details>
<details><summary data-t="l4"></summary><ul data-l="l4i"></ul></details>
</section>

<section id="water"><h2 data-t="nWater"></h2>
<div class="c">
<div class="g">
<div><label for="ph">pH</label><input id="ph" type="number" step="0.1" min="0" max="14" inputmode="decimal" placeholder="7.5"></div>
<div><label for="do" data-t="ox"></label><input id="do" type="number" step="0.1" min="0" inputmode="decimal" placeholder="5"></div>
<div><label for="tp" data-t="tmp"></label><input id="tp" type="number" step="0.5" inputmode="decimal" placeholder="29"></div>
</div>
<button class="btn" id="wb" type="button" data-t="chk"></button>
<div class="r" id="wr" aria-live="polite"></div>
</div></section>

<section id="feed"><h2 data-t="nFeed"></h2>
<div class="c">
<div class="g">
<div><label for="fn" data-t="fn"></label><input id="fn" type="number" min="1" inputmode="numeric" placeholder="10000"></div>
<div><label for="fw" data-t="fw"></label><input id="fw" type="number" min="1" inputmode="decimal" placeholder="150"></div>
<div><label for="fp" data-t="fp"></label><input id="fp" type="number" min="0" inputmode="decimal" placeholder="50"></div>
</div>
<button class="btn" id="fb" type="button" data-t="calc"></button>
<div class="r" id="fr" aria-live="polite"></div>
</div></section>

<section id="schemes"><h2 data-t="nSch"></h2>
<div class="c"><h3 data-t="s1"></h3><p data-t="s1d"></p></div>
<div class="c"><h3 data-t="s2"></h3><p data-t="s2d"></p></div>
<div class="c"><h3 data-t="s3"></h3><p data-t="s3d"></p></div>
<p class="mu" data-t="sn"></p>
</section>

<section id="diary"><h2 data-t="nDiary"></h2>
<div class="c">
<div class="g">
<div><label for="dd" data-t="dt"></label><input id="dd" type="date"></div>
<div><label for="dy" data-t="ty"></label><select id="dy"><option value="a" data-t="ty1"></option><option value="b" data-t="ty2"></option><option value="c" data-t="ty3"></option><option value="d" data-t="ty4"></option><option value="e" data-t="ty5"></option></select></div>
<div><label for="dn" data-t="nt"></label><input id="dn" type="text" data-p="ntp"></div>
</div>
<button class="btn" id="db" type="button" data-t="save"></button>
<div id="dl"></div>
</div></section>

<section id="survey"><h2 data-t="nSur"></h2>
<p class="mu" data-t="sv0"></p>
<div class="c"><h3 data-t="q1"></h3><div class="bars" id="c1"></div></div>
<div class="c"><h3 data-t="q2"></h3><div class="bars" id="c2"></div></div>
</section>

</main>
<script>
var T={
sub:["Fish farming guide for Kalavakunta village","కలవకుంట గ్రామ చేపల రైతులకు మార్గదర్శి"],
nLearn:["Learn","నేర్చుకోండి"],nWater:["Water check","నీటి పరీక్ష"],nFeed:["Feed","మేత"],nSch:["Schemes","పథకాలు"],nDiary:["Farm diary","పొలం డైరీ"],nSur:["Survey","సర్వే"],
l1:["1. Pond preparation","1. చెరువు సిద్ధం చేయడం"],
l1i:["Dry the pond bottom for 7–10 days and remove black mud.|Apply lime (about 200–400 kg per acre) to correct soil acidity.|Fill water through a fine net to keep wild fish out.|Wait until the water turns light green before stocking.","చెరువు అడుగు భాగాన్ని 7–10 రోజులు ఎండబెట్టి నల్లటి బురదను తొలగించండి.|నేల ఆమ్లత్వం సరిచేయడానికి ఎకరాకు సుమారు 200–400 కిలోల సున్నం వేయండి.|అడవి చేపలు రాకుండా సన్నని వలతో నీరు నింపండి.|నీరు లేత ఆకుపచ్చగా మారిన తర్వాతే పిల్లలను వదలండి."],
l2:["2. Seed (fingerlings)","2. చేప పిల్లలు"],
l2i:["Buy active, same-size seed from a trusted hatchery.|Stock in the cool morning or evening, not in hot sun.|Float the bag in the pond for 15–20 minutes so the temperature matches.|Ask the Fisheries Department how many seed suit your species and pond.","నమ్మకమైన హేచరీ నుండి చురుకైన, ఒకే సైజు పిల్లలను కొనండి.|చల్లని ఉదయం లేదా సాయంత్రం వదలండి, ఎండలో వద్దు.|ఉష్ణోగ్రత సమానం కావడానికి సంచిని 15–20 నిమిషాలు చెరువులో తేలనివ్వండి.|మీ చేప రకం, చెరువుకు ఎన్ని పిల్లలు సరిపోతాయో మత్స్యశాఖను అడగండి."],
l3:["3. Feeding","3. మేత వేయడం"],
l3i:["Feed twice a day, same time and same place.|Give only what fish finish in about 30 minutes.|Give less on cloudy days or when the water is poor.|Keep feed dry. Never use moldy feed.","రోజుకు రెండుసార్లు ఒకే సమయం, ఒకే చోట మేత వేయండి.|చేపలు సుమారు 30 నిమిషాల్లో తినేంత మాత్రమే వేయండి.|మబ్బుగా ఉన్నప్పుడు లేదా నీరు బాగోలేనప్పుడు తక్కువ వేయండి.|మేతను పొడిగా ఉంచండి. బూజు పట్టిన మేత వాడకండి."],
l4:["4. Disease","4. వ్యాధులు"],
l4i:["Warning signs: fish gasping at the surface, red spots, sores, slow swimming, not eating.|Test the water first. Most problems start with bad water.|Remove dead fish at once and bury them away from the pond.|Call the Fisheries officer before using any medicine.","హెచ్చరిక సంకేతాలు: నీటి పైకి వచ్చి గాలి పీల్చడం, ఎర్ర మచ్చలు, పుండ్లు, నెమ్మదిగా ఈదడం, మేత తినకపోవడం.|ముందు నీటిని పరీక్షించండి. చాలా సమస్యలు చెడు నీటితోనే మొదలవుతాయి.|చనిపోయిన చేపలను వెంటనే తీసి చెరువుకు దూరంగా పూడ్చండి.|ఏ మందు వాడే ముందైనా మత్స్య అధికారిని సంప్రదించండి."],
ox:["Oxygen (mg/L)","ఆక్సిజన్ (mg/L)"],tmp:["Temperature (°C)","ఉష్ణోగ్రత (°C)"],chk:["Check water","నీటిని పరీక్షించు"],
good:["Good","బాగుంది"],watch:["Watch closely","జాగ్రత్త"],bad:["Danger: act now","ప్రమాదం: వెంటనే చర్య తీసుకోండి"],
phL:["Low pH: add lime.","pH తక్కువ: సున్నం వేయండి."],phH:["High pH: change some water.","pH ఎక్కువ: కొంత నీరు మార్చండి."],
oL:["Low oxygen: run the aerator, stop feeding.","ఆక్సిజన్ తక్కువ: ఏరేటర్ నడపండి, మేత ఆపండి."],
tH:["Too hot: add fresh water, feed less.","వేడి ఎక్కువ: మంచినీరు కలపండి, మేత తగ్గించండి."],tL:["Too cold: feed less.","చలి ఎక్కువ: మేత తగ్గించండి."],
enter:["Enter at least one value.","కనీసం ఒక విలువ నమోదు చేయండి."],
fn:["Number of fish","చేపల సంఖ్య"],fw:["Average weight (grams)","సగటు బరువు (గ్రాములు)"],fp:["Feed price (₹/kg)","మేత ధర (₹/కిలో)"],calc:["Calculate feed","మేత లెక్కించు"],
fr:["Feeding rate","మేత శాతం"],fd:["Feed per day","రోజుకు మేత"],fm:["Per meal (2 meals)","ఒక్కసారికి (రోజుకు 2 సార్లు)"],fc:["Cost per day","రోజు ఖర్చు"],fe:["Enter number of fish and average weight.","చేపల సంఖ్య, సగటు బరువు నమోదు చేయండి."],
s1:["PMMSY (Matsya Sampada Yojana)","PMMSY (మత్స్య సంపద యోజన)"],s1d:["Subsidy for new ponds, seed, feed and equipment: up to 40% for general farmers, up to 60% for women and SC/ST farmers.","కొత్త చెరువులు, పిల్లలు, మేత, పరికరాలకు సబ్సిడీ: సాధారణ రైతులకు 40% వరకు, మహిళలు, ఎస్సీ/ఎస్టీ రైతులకు 60% వరకు."],
s2:["Kisan Credit Card (fisheries)","కిసాన్ క్రెడిట్ కార్డ్ (మత్స్య)"],s2d:["Low-interest working loan for feed, seed and labour. Apply at your bank.","మేత, పిల్లలు, కూలీ ఖర్చులకు తక్కువ వడ్డీ రుణం. మీ బ్యాంకులో దరఖాస్తు చేయండి."],
s3:["Aqua power rate (Andhra Pradesh)","ఆక్వా విద్యుత్ రాయితీ (ఆంధ్రప్రదేశ్)"],s3d:["Registered aqua farmers can get electricity at a lower rate for aerators and pumps.","నమోదైన ఆక్వా రైతులకు ఏరేటర్లు, పంపులకు తక్కువ ధరకు విద్యుత్ లభిస్తుంది."],
sn:["Rules and amounts change. Confirm at the Fisheries Department office or your Rythu Bharosa Kendram.","నియమాలు, మొత్తాలు మారవచ్చు. మత్స్యశాఖ కార్యాలయం లేదా రైతు భరోసా కేంద్రంలో నిర్ధారించుకోండి."],
dt:["Date","తేదీ"],ty:["Type","రకం"],nt:["Note","గమనిక"],ntp:["e.g. 5 kg feed, pH 8","ఉదా. 5 కిలోల మేత, pH 8"],save:["Save entry","నమోదు చేయి"],
ty1:["Feeding","మేత"],ty2:["Water check","నీటి పరీక్ష"],ty3:["Medicine","మందు"],ty4:["Harvest","పట్టుబడి"],ty5:["Expense","ఖర్చు"],
dempty:["No entries yet. Add your first note above.","ఇంకా నమోదులు లేవు. పైన మొదటి నమోదు చేయండి."],del:["Delete","తొలగించు"],
sv0:["Sample data from 50 farmers (for illustration).","50 మంది రైతుల నమూనా సమాచారం (ఉదాహరణ కోసం)."],
q1:["Biggest problems (% of farmers)","పెద్ద సమస్యలు (% రైతులు)"],q2:["Where farmers learn (%)","రైతులు ఎక్కడ నేర్చుకుంటారు (%)"]

var S1=[[["Feed cost","మేత ఖర్చు"],68],[["Disease","వ్యాధులు"],42],[["Low fish price","చేప ధర తక్కువ"],35],[["Water quality","నీటి నాణ్యత"],30],[["Power supply","విద్యుత్"],24]];
var S2=[[["Neighbour farmers","పక్క రైతులు"],60],[["Feed dealer","మేత డీలర్"],45],[["Fisheries officer","మత్స్య అధికారి"],25],[["Phone / YouTube","ఫోన్ / యూట్యూబ్"],20]];
var TY=["ty1","ty2","ty3","ty4","ty5"];
var $=function(i){return document.getElementById(i)};
var L=0;try{L=localStorage.getItem("aqua_lang")==="te"?1:0}catch(e){}
var wd=false,fd=false;
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function apply(){
document.documentElement.lang=L?"te":"en";
$("lang").textContent=L?"English":"తెలుగు";
document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=T[e.dataset.t][L]});
document.querySelectorAll("[data-l]").forEach(function(e){e.innerHTML=T[e.dataset.l][L].split("|").map(function(x){return"<li>"+x+"</li>"}).join("")});
document.querySelectorAll("[data-p]").forEach(function(e){e.placeholder=T[e.dataset.p][L]});
if(wd)water();if(fd)feed();diary();bars("c1",S1);bars("c2",S2);
}
$("lang").onclick=function(){L=L?0:1;try{localStorage.setItem("aqua_lang",L?"te":"en")}catch(e){}apply()};

function grade(v,g,w){return(v>=g[0]&&v<=g[1])?"ok":(v>=w[0]&&v<=w[1])?"wa":"bd"}
function water(){
wd=true;var out=[],tips=[];
var p=parseFloat($("ph").value),o=parseFloat($("do").value),t=parseFloat($("tp").value);
function row(n,v,s){out.push('<div class="row"><span>'+n+" = "+v+'</span><span class="st '+s+'">'+T[s==="ok"?"good":s==="wa"?"watch":"bad"][L]+"</span></div>")}
if(!isNaN(p)){var s=grade(p,[7.5,8.5],[6.5,9]);row("pH",p,s);if(s!=="ok")tips.push(p<7.5?"phL":"phH")}
if(!isNaN(o)){var s2=o>=5?"ok":o>=3?"wa":"bd";row(T.ox[L].split(" ")[0],o,s2);if(s2!=="ok")tips.push("oL")}
if(!isNaN(t)){var s3=grade(t,[26,32],[22,35]);row(T.tmp[L].split(" ")[0],t,s3);if(s3!=="ok")tips.push(t>32?"tH":"tL")}
if(!out.length){$("wr").innerHTML="<p>"+T.enter[L]+"</p>";return}
$("wr").innerHTML=out.join("")+(tips.length?"<ul>"+tips.map(function(k){return"<li>"+T[k][L]+"</li>"}).join("")+"</ul>":"");
}
$("wb").onclick=water;

function feed(){
fd=true;var n=parseFloat($("fn").value),w=parseFloat($("fw").value),pr=parseFloat($("fp").value);
if(!(n>0&&w>0)){$("fr").innerHTML="<p>"+T.fe[L]+"</p>";return}
var r=w<50?5:w<200?3.5:w<500?2.5:1.5;
var kg=n*w/1000*r/100;
var h='<div class="row"><span>'+T.fr[L]+'</span><b>'+r+'%</b></div><div class="row"><span>'+T.fd[L]+'</span><span class="big">'+kg.toFixed(1)+' kg</span></div><div class="row"><span>'+T.fm[L]+'</span><b>'+(kg/2).toFixed(1)+' kg</b></div>';
if(pr>0)h+='<div class="row"><span>'+T.fc[L]+'</span><b>₹'+Math.round(kg*pr).toLocaleString("en-IN")+'</b></div>';
$("fr").innerHTML=h;
}
$("fb").onclick=feed;

function load(){try{return JSON.parse(localStorage.getItem("aqua_diary")||"[]")}catch(e){return[]}}
function put(a){try{localStorage.setItem("aqua_diary",JSON.stringify(a))}catch(e){}}
var mem=null;
function diary(){
var a=mem||(mem=load());
$("dl").innerHTML=a.length?a.map(function(e,i){return'<div class="dl"><div><b>'+T[TY[e.y]][L]+'</b> <small>'+esc(e.d)+'</small>'+esc(e.n)+'</div><button class="x" type="button" data-i="'+i+'">'+T.del[L]+'</button></div>'}).join(""):'<p class="mu">'+T.dempty[L]+"</p>";
}
$("db").onclick=function(){
var a=mem||(mem=load());
a.unshift({d:$("dd").value||new Date().toISOString().slice(0,10),y:$("dy").selectedIndex,n:$("dn").value.trim()});
put(a);$("dn").value="";diary();
};
$("dl").onclick=function(ev){var i=ev.target.getAttribute("data-i");if(i!==null){mem.splice(+i,1);put(mem);diary()}};
$("dd").value=new Date().toISOString().slice(0,10);

function bars(id,d){
$(id).innerHTML=d.map(function(x){return'<div class="bl"><span>'+x[0][L]+'</span><span>'+x[1]+'%</span></div><div class="tr"><div class="fl" style="width:'+x[1]+'%"></div></div>'}).join("");
}
apply();
</script>
</body>
